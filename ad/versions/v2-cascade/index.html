<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sachukardi Ad 16:9</title>
  <link rel="stylesheet" href="./ad.css" />
</head>
<body>
  <!-- A fixed 1920×1080 stage. The preview scales it to fit the window; the
       renderer (render.mjs) captures it 1:1, frame by frame. -->
  <div id="stage">
    <canvas id="gl"></canvas>

    <!-- text moments: each has the screen to itself -->
    <div class="msg m1" data-words="მზად ხარ ცვლილებისთვის?"></div>
    <div class="msg m2" data-words="ერთი სასაჩუქრე ბარათი"></div>
    <div class="msg m3" data-words="რომლითაც ყველგან გადაიხდი"></div>

    <!-- final packshot -->
    <div class="pack">
      <div class="pk1" data-words="საჩუქარდი"></div>
      <div class="pk2" data-words="ყველაფრისთვის, რისი ყიდვაც გინდა"></div>
    </div>
    <div class="contact">
      <div class="url" data-words="www.payunicard.ge"></div>
      <div class="tel" data-words="0322 555 222"></div>
    </div>

    <div class="fade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div id="hud">
    <button id="play" type="button">❚❚</button>
    <input id="scrub" type="range" min="0" max="20" step="0.001" value="0" />
    <span id="time">0.00s</span>
  </div>

  <script type="module" src="./ad.js"></script>
</body>
</html>
